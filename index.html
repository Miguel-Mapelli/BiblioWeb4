<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BiblioWeb — Sua biblioteca, online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<button id="theme-toggle" class="theme-toggle" type="button" aria-label="Mudar para modo escuro" title="Mudar para modo escuro"></button>

<!-- ==========================================================
     TEMPLATES DE TELA
     Cada <template> abaixo contém a marcação estática de uma
     tela (ou de um item repetido dentro de uma tela) do app.
     O script.js apenas clona esses templates, preenche os
     "slots" (elementos marcados com data-slot/data-list) com
     dados dinâmicos e liga os eventos — ele não constrói mais
     HTML por concatenação de strings.
     ========================================================== -->

<!-- Estrutura visível após o login: topo (nav) + conteúdo + rodapé -->
<template id="tpl-shell">
  <header class="topbar">
    <button class="brand" type="button" data-nav="home" aria-label="BiblioWeb — ir para o início">
      <span class="brand-mark">BiblioWeb</span>
      <span class="brand-sub">biblioteca online</span>
    </button>
    <nav class="nav" aria-label="Navegação principal">
      <button class="nav-link help-link" type="button" data-action="help" title="Ajuda e orientações">Ajuda</button>
      <span class="nav-user">
        <span class="nav-user-name" data-slot="user-name"></span>
        <button class="btn-logout" data-action="logout">Sair</button>
      </span>
    </nav>
  </header>
  <main id="main"></main>
  <footer class="appfoot">
    BiblioWeb — protótipo funcional criado para a disciplina de Interação Humano-Computador.
    <button type="button" class="btn-text" data-action="reset-demo" style="margin-left:6px;" title="Apaga os dados desta demonstração e restaura o acervo inicial">Reiniciar demonstração</button>
  </footer>
</template>

<!-- Item de menu do topo (Home/Buscar/Minha Conta ou Painel/Acervo/Empréstimos) -->
<template id="tpl-nav-link">
  <button class="nav-link" type="button" data-nav=""></button>
</template>

<!-- Tela de login (substitui todo o #app enquanto não há sessão) -->
<template id="tpl-login">
  <div class="auth-wrap">
    <div class="auth-brand">
      <div class="brand-mark">BiblioWeb</div>
      <p>Sua biblioteca, online.</p>
    </div>
    <div class="auth-card">
      <div class="role-tabs" role="tablist">
        <button class="role-tab" data-tab="estudante" role="tab">Sou estudante</button>
        <button class="role-tab" data-tab="bibliotecario" role="tab">Sou bibliotecário(a)</button>
      </div>
      <form id="login-form">
        <div class="field">
          <label for="f-name">Nome</label>
          <input id="f-name" name="name" type="text" placeholder="Como podemos te chamar?" autocomplete="name" required aria-describedby="login-hint">
        </div>
        <div class="field">
          <label for="f-email">E-mail</label>
          <input id="f-email" name="email" type="email" placeholder="voce@exemplo.com" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="f-pass">Senha</label>
          <input id="f-pass" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <p class="hint" id="login-hint">Modo demonstração local: informe nome, e-mail válido e qualquer senha fictícia. Não há autenticação real; não use senhas pessoais.</p>
        <button type="submit" class="btn btn-primary btn-block" data-slot="submit-label">Entrar</button>
      </form>
    </div>
    <p class="auth-foot">Trabalho de Interação Humano-Computador — BiblioWeb</p>
  </div>
</template>

<!-- Chip de categoria (usado na Home e na Busca) -->
<template id="tpl-chip">
  <button type="button" class="chip" data-cat=""></button>
</template>

<!-- Card de livro em grade (destaques da Home) -->
<template id="tpl-book-card">
  <button type="button" class="book-card" data-book="" aria-label="Ver detalhes do livro">
    <div class="cover" data-slot="cover"></div>
    <div>
      <h3 data-slot="title"></h3>
      <div class="author" data-slot="author"></div>
    </div>
    <div class="book-meta-row">
      <span class="badge" data-slot="badge"></span>
    </div>
  </button>
</template>

<!-- Tela Home (estudante) -->
<template id="tpl-home">
  <div class="screen">
    <div class="eyebrow">Home</div>
    <h1 class="page-title">Boa leitura, <span data-slot="first-name"></span>.</h1>
    <p class="page-lede">Encontre livros, acompanhe seus empréstimos e descubra novas leituras.</p>
    <div class="quick-actions" aria-label="Atalhos">
      <button type="button" class="quick-action" data-nav="busca"><span class="quick-action-icon" aria-hidden="true">⌕</span><span><strong>Buscar livros</strong><small>Encontre por título ou autor</small></span></button>
      <button type="button" class="quick-action" data-nav="conta"><span class="quick-action-icon" aria-hidden="true">♙</span><span><strong>Meus empréstimos</strong><small>Consulte prazos e reservas</small></span></button>
      <button type="button" class="quick-action" data-action="new-releases"><span class="quick-action-icon" aria-hidden="true">✦</span><span><strong>Novidades do acervo</strong><small>Explore os títulos disponíveis</small></span></button>
    </div>
    <form class="search-row" id="home-search-form">
      <label class="visually-hidden" for="home-search-input">Buscar livros por título, autor ou categoria</label>
      <input type="search" id="home-search-input" placeholder="Ex.: Dom Casmurro, Machado de Assis..." aria-label="Buscar livros por título, autor ou categoria" autocomplete="off">
      <button type="submit" class="btn btn-primary">Buscar</button>
    </form>
    <div class="section-label">Explore por categoria</div>
    <div class="chips" data-list="chips" aria-label="Categorias de livros"></div>
    <div class="section-label">Livros disponíveis para você</div>
    <div class="book-grid" data-list="livros"></div>
    <div class="empty-note" data-slot="empty" hidden>
      Todos os títulos em destaque estão emprestados no momento.<br>
      <button class="btn-text" data-nav="busca">Ver acervo completo</button>
    </div>
  </div>
</template>

<!-- Linha de resultado de busca -->
<template id="tpl-book-list-row">
  <div class="list-row">
    <div class="cover-sm" data-slot="cover"></div>
    <div class="list-row-info">
      <h3 data-slot="title"></h3>
      <div class="author" data-slot="author"></div>
      <div class="list-row-cat" data-slot="category"></div>
    </div>
    <span class="badge" data-slot="badge"></span>
    <button class="btn btn-ghost btn-sm" data-book="">Ver detalhes</button>
  </div>
</template>

<!-- Tela Buscar -->
<template id="tpl-busca">
  <div class="screen">
    <div class="eyebrow">Buscar</div>
    <h1 class="page-title">Explorar o acervo</h1>
    <form class="search-row" id="busca-form">
      <label class="visually-hidden" for="busca-input">Buscar livros por título, autor ou categoria</label>
      <input type="search" id="busca-input" placeholder="Ex.: 1984, George Orwell..." aria-label="Buscar livros por título, autor ou categoria" autocomplete="off">
      <button type="submit" class="btn btn-primary">Buscar</button>
    </form>
    <div class="chips" data-list="chips"></div>
    <div class="section-label" data-slot="count" role="status" aria-live="polite"></div>
    <div data-list="resultados"></div>
    <div class="empty-note" data-slot="empty" hidden>Nenhum livro encontrado. Tente outro termo ou categoria.</div>
  </div>
</template>

<!-- Linha da ficha técnica (tela de detalhe do livro) -->
<template id="tpl-spec-row">
  <div class="confirm-detail-row"><span data-slot="label"></span><span data-slot="value"></span></div>
</template>

<!-- Ações possíveis na tela de detalhe, conforme o status do livro -->
<template id="tpl-detail-action-borrow">
  <button type="button" class="btn btn-primary" data-action="borrow">Emprestar este livro</button>
  <span class="page-lede" style="max-width:none;">Leve o título com você agora — devolução em até 15 dias.</span>
</template>
<template id="tpl-detail-action-queued">
  <button class="btn btn-ghost" disabled data-slot="queue-label"></button>
  <span class="page-lede" style="max-width:none;">Avisaremos você assim que o título for devolvido.</span>
</template>
<template id="tpl-detail-action-reserve">
  <button type="button" class="btn btn-primary" data-action="reserve">Entrar na fila de reserva</button>
  <span class="page-lede" style="max-width:none;">Este título está emprestado. Reservar te coloca na fila de espera — avisamos quando ele for devolvido, e aí você poderá emprestá-lo.</span>
</template>

<!-- Tela de detalhe do livro -->
<template id="tpl-detalhe">
  <div class="screen">
    <button type="button" class="back-link" data-action="back" aria-label="Voltar para a busca">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Voltar
    </button>
    <div class="detail-wrap">
      <div class="cover" data-slot="cover"></div>
      <div>
        <div class="list-row-cat" data-slot="category"></div>
        <h1 class="detail-title" data-slot="title"></h1>
        <div class="detail-author" data-slot="author"></div>
        <p class="detail-synopsis" data-slot="synopsis"></p>
        <span class="badge" data-slot="badge"></span>
        <div class="section-label" style="margin-top:26px;">Ficha técnica</div>
        <div class="confirm-detail" style="margin:0;" data-list="specs"></div>
        <div class="detail-actions" data-slot="actions"></div>
      </div>
    </div>
  </div>
</template>

<!-- Tela simples usada quando não há nada para mostrar (ex.: livro/confirmação inexistente) -->
<template id="tpl-mensagem-tela">
  <div class="screen"><p data-slot="mensagem"></p></div>
</template>

<!-- Confirmação de empréstimo -->
<template id="tpl-confirmacao-emprestimo">
  <div class="screen">
    <div class="confirm-wrap">
      <div class="confirm-check">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h1 class="page-title">Empréstimo confirmado!</h1>
      <p class="page-lede" style="margin:8px auto 0;">Aproveite a leitura. Você pode acompanhar o prazo em Minha Conta.</p>
      <div class="confirm-detail">
        <div class="confirm-detail-row"><span>Título</span><strong data-slot="titulo"></strong></div>
        <div class="confirm-detail-row"><span>Retirado em</span><span data-slot="retirado"></span></div>
        <div class="confirm-detail-row"><span>Devolução até</span><strong data-slot="devolucao"></strong></div>
      </div>
      <div class="confirm-actions">
        <button class="btn btn-primary" data-nav="conta">Ir para Minha Conta</button>
        <button class="btn btn-ghost" data-nav="home">Voltar para a Home</button>
      </div>
    </div>
  </div>
</template>

<!-- Confirmação de reserva -->
<template id="tpl-confirmacao-reserva">
  <div class="screen">
    <div class="confirm-wrap">
      <div class="confirm-check">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h1 class="page-title">Reserva confirmada!</h1>
      <p class="page-lede" style="margin:8px auto 0;">Avisaremos você assim que o título for devolvido — aí é só emprestá-lo.</p>
      <div class="confirm-detail">
        <div class="confirm-detail-row"><span>Título</span><strong data-slot="titulo"></strong></div>
        <div class="confirm-detail-row"><span>Reservado em</span><span data-slot="reservado"></span></div>
        <div class="confirm-detail-row"><span>Posição na fila</span><strong data-slot="posicao"></strong></div>
      </div>
      <div class="confirm-actions">
        <button class="btn btn-primary" data-nav="conta">Ir para Minha Conta</button>
        <button class="btn btn-ghost" data-nav="home">Voltar para a Home</button>
      </div>
    </div>
  </div>
</template>

<!-- Card de empréstimo ativo (Minha Conta) -->
<template id="tpl-loan-card">
  <div class="loan-card">
    <div class="cover-sm" data-slot="cover"></div>
    <div class="loan-info">
      <h3 data-slot="title"></h3>
      <div class="author" data-slot="author"></div>
      <div class="loan-due" data-slot="due"></div>
    </div>
    <div class="loan-actions">
      <button class="btn btn-ghost btn-sm" data-renew="">Renovar</button>
    </div>
  </div>
</template>

<!-- Card de reserva ativa (Minha Conta) -->
<template id="tpl-reservation-card">
  <div class="loan-card">
    <div class="cover-sm" data-slot="cover"></div>
    <div class="loan-info">
      <h3 data-slot="title"></h3>
      <div class="author" data-slot="author"></div>
      <div class="loan-due" data-slot="info"></div>
    </div>
    <div class="loan-actions">
      <button class="btn btn-ghost btn-sm" data-cancel-reserve="">Cancelar</button>
    </div>
  </div>
</template>

<!-- Tela Minha Conta -->
<template id="tpl-conta">
  <div class="screen">
    <div class="eyebrow">Minha Conta</div>
    <h1 class="page-title" data-slot="nome"></h1>
    <p class="page-lede">Empréstimos levam o título para casa agora; reservas colocam você na fila de espera de algo emprestado.</p>
    <div class="section-label" data-slot="titulo-emprestimos"></div>
    <div data-list="emprestimos"></div>
    <div class="empty-note" data-slot="empty-emprestimos" hidden>Você não tem empréstimos ativos no momento. <br><button class="btn-text" data-nav="busca">Explorar o acervo</button></div>
    <div class="section-label" data-slot="titulo-reservas"></div>
    <div data-list="reservas"></div>
    <div class="empty-note" data-slot="empty-reservas" hidden>Você não está na fila de nenhum título no momento.</div>
    <div class="section-label" data-slot="titulo-historico"></div>
    <div data-list="historico"></div>
    <div class="empty-note" data-slot="empty-historico" hidden>Seu histórico aparecerá aqui após a primeira devolução.</div>
  </div>
</template>

<!-- Cartão de estatística (Painel do bibliotecário) -->
<template id="tpl-stat-card">
  <div class="stat-card"><div class="stat-num" data-slot="num"></div><div class="stat-label" data-slot="label"></div></div>
</template>

<!-- Item de atividade recente (Painel do bibliotecário) -->
<template id="tpl-activity-item">
  <div class="activity-item">
    <span class="activity-dot"></span>
    <span><span data-slot="text"></span> <span class="activity-time" data-slot="time"></span></span>
  </div>
</template>

<!-- Tela Painel do bibliotecário -->
<template id="tpl-painel">
  <div class="screen">
    <div class="eyebrow">Painel</div>
    <h1 class="page-title">Olá, <span data-slot="first-name"></span>.</h1>
    <p class="page-lede">Visão geral do acervo e da atividade recente da biblioteca.</p>
    <div class="stat-grid" data-list="stats"></div>
    <div class="detail-actions" style="margin:18px 0;">
      <button type="button" class="btn btn-ghost" data-action="export-data">Exportar dados</button>
      <button type="button" class="btn btn-ghost" data-action="import-data">Importar backup</button>
      <input type="file" id="import-data-file" accept="application/json,.json" hidden>
    </div>
    <div class="section-label">Atividade recente</div>
    <div data-list="atividades"></div>
    <div class="empty-note" data-slot="empty" hidden>Nenhuma atividade ainda.</div>
  </div>
</template>

<!-- Linha da tabela de acervo (gerenciar livros) -->
<template id="tpl-acervo-row">
  <tr>
    <td><div class="cover-sm" data-slot="cover"></div></td>
    <td data-slot="title"></td>
    <td data-slot="author"></td>
    <td data-slot="category"></td>
    <td><span class="badge" data-slot="badge"></span></td>
    <td class="actions-cell">
      <button class="btn btn-ghost btn-sm" data-edit="">Editar</button>
      <button class="btn btn-danger btn-sm" data-del="">Excluir</button>
    </td>
  </tr>
</template>

<!-- Linha vazia genérica de tabela (colspan/texto definidos via JS) -->
<template id="tpl-empty-row">
  <tr><td class="empty-note" data-slot="text"></td></tr>
</template>

<!-- Checkbox de gênero (usado no formulário de livro; um livro pode ter vários) -->
<template id="tpl-cat-check">
  <label class="cat-check"><input type="checkbox" value=""><span></span></label>
</template>

<!-- Modal de cadastro/edição de livro -->
<template id="tpl-book-modal">
  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal">
      <h2 data-slot="titulo"></h2>
      <form id="book-form">
        <div class="field"><label for="m-title">Título</label><input id="m-title" required></div>
        <div class="field"><label for="m-author">Autor</label><input id="m-author" required></div>
        <div class="field"><label>Gêneros <span class="hint">(selecione um ou mais)</span></label>
          <div class="cat-check-group" id="m-cat-group"></div>
        </div>
        <div class="field">
          <label for="m-status">Status</label>
          <select id="m-status">
            <option value="Disponível">Disponível</option>
            <option value="Emprestado">Emprestado</option>
          </select>
        </div>
        <div class="field"><label for="m-syn">Sinopse</label><textarea id="m-syn"></textarea></div>
        <div class="section-label" style="margin:18px 0 10px;">Ficha técnica</div>
        <div class="field-row">
          <div class="field"><label for="m-pub">Editora</label><input id="m-pub"></div>
          <div class="field"><label for="m-year">Ano</label><input id="m-year"></div>
        </div>
        <div class="field-row">
          <div class="field"><label for="m-edition">Edição</label><input id="m-edition"></div>
          <div class="field"><label for="m-lang">Idioma</label><input id="m-lang"></div>
        </div>
        <div class="field-row">
          <div class="field"><label for="m-isbn">ISBN</label><input id="m-isbn"></div>
          <div class="field"><label for="m-pages">Páginas</label><input id="m-pages"></div>
        </div>
        <div class="field-row">
          <div class="field"><label for="m-dims">Dimensões (cm)</label><input id="m-dims" placeholder="ex.: 21,0 x 14,0 x 2,0 cm"></div>
          <div class="field"><label for="m-weight">Peso</label><input id="m-weight" placeholder="ex.: 350 g"></div>
        </div>
        <div class="detail-actions">
          <button type="submit" class="btn btn-primary">Salvar</button>
          <button type="button" class="btn btn-ghost" data-action="close-modal">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
</template>

<!-- Tela Acervo (gerenciar livros) -->
<template id="tpl-acervo">
  <div class="screen">
    <div class="eyebrow">Acervo</div>
    <h1 class="page-title">Gerenciar acervo</h1>
    <p class="page-lede">Cadastre novos títulos, edite informações e acompanhe a disponibilidade de cada exemplar.</p>
    <div class="table-toolbar">
      <input type="search" id="acervo-search" placeholder="Buscar por título ou autor..." aria-label="Buscar no acervo por título ou autor" autocomplete="off">
      <button class="btn btn-primary" data-action="new-book">+ Novo Livro</button>
    </div>
    <div class="table-scroll">
      <table>
        <thead><tr><th>Capa</th><th>Título</th><th>Autor</th><th>Categoria</th><th>Status</th><th>Ações</th></tr></thead>
        <tbody data-list="linhas"></tbody>
      </table>
    </div>
    <div data-slot="modal-container"></div>
  </div>
</template>

<!-- Linha de empréstimo ativo (painel do bibliotecário) -->
<template id="tpl-emprestimo-row">
  <tr>
    <td data-slot="title"></td>
    <td data-slot="patron"></td>
    <td data-slot="borrowed"></td>
    <td data-slot="due"></td>
    <td class="actions-cell"><button class="btn btn-ghost btn-sm" data-return="">Confirmar devolução</button></td>
  </tr>
</template>

<!-- Linha da fila de reservas (painel do bibliotecário) -->
<template id="tpl-reserva-fila-row">
  <tr>
    <td data-slot="title"></td>
    <td data-slot="patron"></td>
    <td data-slot="reserved"></td>
    <td data-slot="pos"></td>
    <td class="actions-cell"><button class="btn btn-ghost btn-sm" data-fulfill-reservation="" disabled>Aguardando</button></td>
  </tr>
</template>

<!-- Tela de gerenciamento de empréstimos (bibliotecário) -->
<template id="tpl-emprestimos-bib">
  <div class="screen">
    <div class="eyebrow">Empréstimos</div>
    <h1 class="page-title">Gerenciar empréstimos</h1>
    <p class="page-lede">Confirme devoluções para liberar o título novamente no acervo. Quando houver fila, o primeiro estudante recebe prioridade de retirada por 3 dias.</p>
    <div class="section-label" data-slot="titulo-ativos"></div>
    <div class="table-scroll">
      <table>
        <thead><tr><th>Título</th><th>Estudante</th><th>Retirado em</th><th>Devolução</th><th>Ações</th></tr></thead>
        <tbody data-list="ativos"></tbody>
      </table>
    </div>
    <div class="section-label" data-slot="titulo-fila"></div>
    <div class="table-scroll">
      <table>
        <thead><tr><th>Título</th><th>Usuário</th><th>Reservado em</th><th>Posição / situação</th><th>Ação</th></tr></thead>
        <tbody data-list="fila"></tbody>
      </table>
    </div>
  </div>
</template>


<!-- Tela de contas demonstrativas (bibliotecário) -->
<template id="tpl-usuarios">
  <div class="screen">
    <div class="eyebrow">Usuários</div>
    <h1 class="page-title">Contas demonstrativas</h1>
    <p class="page-lede">As contas são criadas automaticamente quando alguém entra no protótipo. É possível consultar os perfis e simular a ativação ou desativação de acesso neste navegador.</p>
    <div class="table-toolbar">
      <input type="search" id="usuarios-search" placeholder="Buscar por nome ou e-mail..." aria-label="Buscar usuários" autocomplete="off">
      <span class="hint" data-slot="usuarios-count"></span>
    </div>
    <div class="table-scroll">
      <table>
        <thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Cadastro</th><th>Situação</th><th>Ação</th></tr></thead>
        <tbody data-list="usuarios"></tbody>
      </table>
    </div>
  </div>
</template>

<!-- Ajuda contextual e tour de boas-vindas -->
<template id="tpl-help">
  <div class="modal-backdrop help-backdrop" id="help-backdrop">
    <section class="modal help-modal" role="dialog" aria-modal="true" aria-labelledby="help-title">
      <div class="modal-heading">
        <div><div class="eyebrow">Central de ajuda</div><h2 id="help-title">Como usar o BiblioWeb</h2></div>
        <button type="button" class="icon-close" data-action="close-help" aria-label="Fechar ajuda">×</button>
      </div>
      <p class="page-lede">Encontre rapidamente o que você precisa. Você pode voltar a esta orientação sempre que quiser.</p>
      <ol class="help-steps">
        <li><strong>Buscar livros</strong><span>Digite título, autor ou categoria. Use os filtros para refinar os resultados.</span></li>
        <li><strong>Ver detalhes</strong><span>Selecione um livro para consultar sinopse, ficha técnica e disponibilidade.</span></li>
        <li><strong>Emprestar ou reservar</strong><span>Livros disponíveis podem ser emprestados. Se estiverem emprestados, entre na fila de reserva.</span></li>
        <li><strong>Acompanhar sua conta</strong><span>Em “Minha Conta”, consulte prazos, renove empréstimos e cancele reservas.</span></li>
      </ol>
      <div class="help-tip"><strong>Dica:</strong> o item destacado no menu indica a página atual. Use “Voltar” para retornar sem perder o controle da navegação.</div>
      <div class="detail-actions"><button type="button" class="btn btn-primary" data-action="close-help">Entendi</button></div>
    </section>
  </div>
</template>
